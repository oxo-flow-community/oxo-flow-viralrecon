# Environment for MULTIQC + multiqc_to_custom_csv.py — pinned exactly to the
# upstream nf-core/multiqc module (pyyaml comes in as a multiqc dependency).
name: multiqc
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::multiqc=1.31
  # multiqc_to_custom_csv.py imports yaml directly; multiqc 1.31 does
  # not pin pyyaml on this platform (live: ModuleNotFoundError)
  - conda-forge::pyyaml=6.0.2
