# Environment for MOSDEPTH_GENOME and MOSDEPTH_AMPLICON — pinned to the
# upstream nf-core/mosdepth module (mosdepth=0.3.11=h0ec343a_1; the build
# string is dropped for cross-platform resolution, version pin kept exact).
name: mosdepth
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::htslib=1.22.1
  - bioconda::mosdepth=0.3.11
