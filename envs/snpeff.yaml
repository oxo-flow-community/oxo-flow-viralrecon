# Environment for SNPEFF_BUILD, SNPEFF_ANN (+bgzip/tabix) and
# SNPSIFT_EXTRACTFIELDS — pinned exactly to the upstream local/snpeff and
# local/snpsift modules; htslib from the upstream nf-core/tabix modules.
name: snpeff
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::snpeff=5.0
  - bioconda::snpsift=4.3.1t
  # htslib bumped 1.21 -> 1.22 to satisfy bcftools 1.22's >=1.22
  # constraint (live: solve conflict)
  - bioconda::htslib=1.22
  # the merged snpeff_ann rule also runs bcftools stats (upstream's
  # VCF_BGZIP_TABIX_STATS ran in a separate bcftools process — live:
  # 'bcftools: command not found')
  - bioconda::bcftools=1.22
