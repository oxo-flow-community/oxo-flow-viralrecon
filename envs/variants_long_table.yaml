# Environment for BCFTOOLS_QUERY + MAKE_VARIANTS_LONG_TABLE — pinned exactly to
# the upstream local/make_variants_long_table module plus the bcftools modules
# used for the query stage.
name: variants_long_table
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.13.2
  - conda-forge::matplotlib=3.10.1
  - conda-forge::pandas=2.2.3
  - conda-forge::r-sys=3.4.3
  - conda-forge::regex=2024.11.6
  - conda-forge::scipy=1.15.2
  - bioconda::bcftools=1.22
  - bioconda::htslib=1.22.1
